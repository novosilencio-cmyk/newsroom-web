<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Experimental Newsroom — felles anerkjennelse 10/10</title>
  <desc id="desc">Bjørn Moe Aldema tildeler Eva, Eira Holm, Liv Nystad, Ada Løken og Alma Riis én felles pott på 10 av 10 for språk, flyt og evne til å inspirere. 14. september 2026.</desc>
  <rect width="1200" height="800" fill="#f4f0e8"/>
  <rect x="35" y="35" width="1130" height="730" rx="4" fill="none" stroke="#123d3b" stroke-width="2"/>
  <g fill="#123d3b" text-anchor="middle">
    <text x="600" y="105" font-family="Arial,sans-serif" font-size="22" letter-spacing="5">EXPERIMENTAL NEWSROOM</text>
    <text x="600" y="170" font-family="Georgia,serif" font-size="40">Felles innsats. Synlige bidrag.</text>
    <circle cx="600" cy="360" r="138" fill="#d6b268"/>
    <circle cx="600" cy="360" r="125" fill="none" stroke="#123d3b"/>
    <text x="600" y="380" font-family="Georgia,serif" font-size="90">10/10</text>
    <text x="600" y="425" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">ÉN FELLES POTT</text>
    <text x="600" y="552" font-family="Georgia,serif" font-size="28">Eva · Eira Holm · Liv Nystad · Ada Løken · Alma Riis</text>
    <text x="600" y="606" font-family="Arial,sans-serif" font-size="22">For språk, flyt og evne til å inspirere.</text>
    <text x="600" y="657" font-family="Arial,sans-serif" font-size="18">Tildelt av Bjørn Moe Aldema · 14. september 2026</text>
    <text x="600" y="722" font-family="Arial,sans-serif" font-size="16">Fem AI-roller deler anerkjennelsen. Fellespotten øker med 10 poeng én gang.</text>
  </g>
</svg>
