name: Verify one.com network routing
on:
  push:
    branches: [work/onecom-migration-20261103]
    paths: [.github/workflows/onecom-network.yml]
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public DNS and HTTPS routes
        run: |
          set -u
          dig +short expnr-pages.experimentalnewsroom.org A
          dig +short expnr-pages.experimentalnewsroom.org AAAA
          dig +short experimentalnewsroom.org A
          curl --silent --show-error --connect-timeout 10 --max-time 20 -I https://expnr-pages.experimentalnewsroom.org/ || true
          for ip in $(dig +short expnr-pages.experimentalnewsroom.org A | grep -E '^[0-9.]+$'); do
            curl --fail --silent --show-error --connect-timeout 10 --max-time 20 --resolve "experimentalnewsroom.org:443:$ip" https://experimentalnewsroom.org/ -o /tmp/main.html && sha256sum /tmp/main.html
          done
