name: W-R2 one-time receipt staging
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  stage-reviewed-receipts:
    if: github.repository == 'novosilencio-cmyk/newsroom-web' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/virkemidlene-wr2-20261003'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Materialize only the two reviewed receipts
        run: |
          python3 - <<'PY'
          import copy, hashlib, json, runpy, subprocess
          from pathlib import Path
          registry = Path('docs/editorial/language-reviews.json')
          before = json.loads(registry.read_text(encoding='utf-8'))
          rows = copy.deepcopy(before)
          note = 'docs/editorial/virkemidlene-del2-release-2026-10-03.md'
          targets = {
              'public/articles/hvem-er-det-vi-ber-om-a-bruke-mindre-2026.html': '33460c9a0b1c2833f65242054fbf84970ecf680543ebcf34022f55e10c799ac8',
              'public/series/virkemidlene/nb/index.html': '80bcea0865c2eacafcf462ee96470e9608a793d69163a0fbcb8d9307e925f900',
          }
          stages = ('helhetsinntrykk', 'styrker', 'stilprofil', 'konkrete_svakheter', 'forbedringsgrep', 'revidert_eksempelversjon')
          refs = ('helhetsinntrykk', 'styrker', 'stilprofil', 'konkrete-svakheter', 'forbedringsgrep', 'revidert-eksempelversjon')
          for path, expected in targets.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected, path
              rows[path] = {
                  'case_id': 'VIRKEMIDLENE-DEL2-W-R2-20261003',
                  'sha256': expected,
                  'reviewer': 'Diana / same-assistant editorial and Ariadne-method review',
                  'execution_context': 'Current publication conversation; same assistant, not independent review',
                  'reviewed_at': '2026-10-03',
                  'comparison_ref': note + '#comparison',
                  'reader_journey_ref': note + '#reader-journey',
                  'semantic_control_ref': note + '#semantic-and-source-control',
                  'loaded_modules': [{
                      'source': 'OOS-Core/OOS_MASTER/PMH/PROJECTS/EXPERIMENTAL_NEWSROOM/ARIADNE_LANGUAGE_COMPARISON_AND_REALIZATION_WORKFLOW_001.md',
                      'revision': '713f6796610652407037c7a0d69385e29d30f727',
                      'application_ref': note + '#method-application',
                  }],
                  'stages': {stage: note + '#' + ref for stage, ref in zip(stages, refs)},
                  'decision': 'KEEP',
                  'ariadne_style_readiness': 'pass_complete',
                  'source_status': 'READY_FOR_EDITORIAL_REVIEW',
                  'publication_approval': {
                      'approved': True,
                      'by': 'Bjørn Moe Aldema',
                      'reference': 'https://github.com/novosilencio-cmyk/newsroom-web/pull/80#issuecomment-5973182216',
                      'sha256': expected,
                  },
              }
          assert all(rows[k] == v for k, v in before.items() if k not in targets)
          assert set(rows) == set(before) | set(targets)
          registry.write_text(json.dumps(rows, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          subprocess.run(['python3', 'scripts/build_discovery.py'], check=True)
          for path, expected in targets.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected, 'Generated bytes changed: ' + path
          for script in ('check_language_review.py', 'check_publication_markers.py', 'check_norwegian_editorial_style.py', 'check_reader_sequence_style.py', 'build_static_site.py'):
              subprocess.run(['python3', 'scripts/' + script], check=True)
          subprocess.run(['python3', '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_*.py'], check=True)
          print('W-R2: exact page hashes preserved; existing unrelated receipt objects unchanged; ordinary gates passed.')
          PY
      - name: Commit only the registry on the fixed release branch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin refs/heads/release/virkemidlene-wr2-20261003 | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git add -- docs/editorial/language-reviews.json
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only)" = 'docs/editorial/language-reviews.json'
          git -c user.name='Experimental Newsroom receipt staging' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Bind approved W-R2 pages to reviewed exact-version receipts'
          git push origin HEAD:refs/heads/release/virkemidlene-wr2-20261003
