name: Deploy static newsroom to GitHub Pages

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export exact public source for bounded recovery
        if: github.event_name == 'pull_request' && github.head_ref == 'work/magnus-virkemidlene-release-20261007'
        run: |
          test "$(git rev-parse refs/remotes/origin/main)" = "82f5d6d5f21317bf9b75010472d2f9ea7ec96655"
          git bundle create /tmp/newsroom-source.bundle refs/remotes/origin/main
          git bundle verify /tmp/newsroom-source.bundle
          sha256sum /tmp/newsroom-source.bundle

      - name: Store bounded public-source handoff
        if: github.event_name == 'pull_request' && github.head_ref == 'work/magnus-virkemidlene-release-20261007'
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-source-82f5d6d5
          path: /tmp/newsroom-source.bundle
          retention-days: 1
          if-no-files-found: error

      - name: Block unresolved editorial markers
        run: |
          python3 scripts/build_discovery.py
          python3 scripts/check_language_review.py
          python3 scripts/check_publication_markers.py
          python3 scripts/check_norwegian_editorial_style.py
          python3 scripts/check_reader_sequence_style.py
          python3 scripts/build_static_site.py
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Upload verified public surface
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: publication-safety
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
